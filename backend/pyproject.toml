[project]
name = "emsolver"
version = "0.1.0"
description = "Smart EM Solver demo backend (mock solver, Claude orchestrator)"
readme = "README.md"
authors = [
    { name = "Michael", email = "ptakmic@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "openai>=3.24.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
emsolver = "emsolver.cli:main"
